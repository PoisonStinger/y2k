
name: Build CYBERPLAY APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'CYBERPLAY-Android-Project.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract Android project
        run: unzip -q CYBERPLAY-Android-Project.zip

      - name: Build debug APK
        working-directory: CYBERPLAY
        run: gradle assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: CYBERPLAY-APK
          path: CYBERPLAY/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
